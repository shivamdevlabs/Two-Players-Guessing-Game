<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070913" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Cyan Glow -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Violet Glow -->
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#06b6d4" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Squircle Base with Glow Border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5" />

  <!-- Player 1 Token Badge (Left - Cyan) -->
  <circle cx="21" cy="24" r="8" fill="#0f172a" stroke="url(#cyanGrad)" stroke-width="2" />
  <text x="21" y="28" font-family="'Outfit', system-ui, sans-serif" font-size="11" font-weight="900" fill="#22d3ee" text-anchor="middle">1</text>

  <!-- Player 2 Token Badge (Right - Violet) -->
  <circle cx="43" cy="24" r="8" fill="#0f172a" stroke="url(#violetGrad)" stroke-width="2" />
  <text x="43" y="28" font-family="'Outfit', system-ui, sans-serif" font-size="11" font-weight="900" fill="#c084fc" text-anchor="middle">2</text>

  <!-- Central Mystery / Guessing Box -->
  <g filter="url(#glow)">
    <rect x="18" y="34" width="28" height="22" rx="6" fill="#1e293b" stroke="#818cf8" stroke-width="1.8" />
    <!-- Mystery Question Mark & Number Hint -->
    <text x="32" y="50.5" font-family="'JetBrains Mono', monospace, sans-serif" font-size="15" font-weight="900" fill="#38bdf8" text-anchor="middle">?</text>
  </g>

  <!-- Mini Sparkle at Top Center -->
  <path d="M32 10 L33.5 14.5 L38 16 L33.5 17.5 L32 22 L30.5 17.5 L26 16 L30.5 14.5 Z" fill="#38bdf8" opacity="0.9" />
</svg>